        body {

        .hero-gradient {

        }
        .custom-card {

            border: 1px solid #e5e7eb;

        /* Floating WhatsApp Button Animation */
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background-color: #25d366;
            color: #FFF;
            border-radius: 50px;
            text-align: center;
            font-size: 30px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            transition: all 0.3s ease-in-out;
        }
        .whatsapp-float:hover {
            transform: scale(1.1);
            background-color: #20ba5a;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }
        /* Scrollable Slider Container with touch support */
        .slider-container {
            overflow-x: auto;
            width: 100%;
            position: relative;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .slider-container::-webkit-scrollbar {
            height: 6px;
        }
        .slider-container::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        .slider-track {
            display: flex;
            width: max-content;
            gap: 16px;
            padding-bottom: 8px;
        }
    </style>
</head>
